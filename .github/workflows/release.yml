name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      TAG_NAME: ${{ github.ref_name }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}

    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read release version
        id: version
        run: |
          if [[ ! "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Use a tag such as v1.2.3 or v1.2.3-beta.1."
            exit 1
          fi
          version="${TAG_NAME#v}"
          echo "number=${version%%-*}" >> "$GITHUB_OUTPUT"

      - name: Check Xcode and SDK
        run: |
          xcodebuild -version
          sdk_version="$(xcrun --sdk macosx --show-sdk-version)"
          if (( ${sdk_version%%.*} < 27 )); then
            echo "::error::Tastko requires the macOS 27 SDK or later."
            exit 1
          fi

      - name: Run unit tests
        run: |
          xcodebuild \
            -project Tastko.xcodeproj \
            -scheme Tastko \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build/TestDerivedData \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            -only-testing:TastkoTests \
            CODE_SIGNING_ALLOWED=NO \
            test

      - name: Validate update signing configuration
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          if [[ -z "$SPARKLE_PUBLIC_ED_KEY" || -z "$SPARKLE_PRIVATE_ED_KEY" ]]; then
            echo "::error::Set the SPARKLE_PUBLIC_ED_KEY and SPARKLE_PRIVATE_ED_KEY repository secrets. See docs/app-updates.md."
            exit 1
          fi

      - name: Install Apple signing credentials
        id: signing
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: bash .github/scripts/install-signing.sh

      - name: Archive app
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.number }}
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        # CI trusts the Defaults macros at the committed Package.resolved revision.
        run: |
          xcodebuild \
            -project Tastko.xcodeproj \
            -scheme Tastko \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/ReleaseDerivedData \
            -archivePath .build/Release/Tastko.xcarchive \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipMacroValidation \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            SPARKLE_PUBLIC_ED_KEY="$SPARKLE_PUBLIC_ED_KEY" \
            SPARKLE_FEED_URL="https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/appcast.xml" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY='Developer ID Application' \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            TASTKO_PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            OTHER_CODE_SIGN_FLAGS=--timestamp \
            CLANG_ENABLE_CODE_COVERAGE=NO \
            archive

      - name: Export Developer ID app
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          python3 - <<'PY'
          import os, plistlib
          with open('.build/Release/ExportOptions.plist', 'wb') as output:
              plistlib.dump({
                  'method': 'developer-id',
                  'signingStyle': 'manual',
                  'signingCertificate': 'Developer ID Application',
                  'teamID': os.environ['APPLE_TEAM_ID'],
                  'provisioningProfiles': {'com.davutcaliskan.Tastko': os.environ['PROFILE_UUID']},
              }, output)
          PY
          xcodebuild -exportArchive \
            -archivePath .build/Release/Tastko.xcarchive \
            -exportPath .build/Release/Export \
            -exportOptionsPlist .build/Release/ExportOptions.plist

      - name: Notarize app
        run: |
          app='.build/Release/Export/Tastko.app'
          ditto -c -k --sequesterRsrc --keepParent "$app" .build/Release/Tastko.zip
          bash .github/scripts/notarize.sh .build/Release/Tastko.zip
          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Verify app and create DMG
        run: |
          app='.build/Release/Export/Tastko.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --verbose=4 "$app" 2>&1 | tee .build/Release/signature.txt
          grep -F "Authority=Developer ID Application:" .build/Release/signature.txt
          grep -F "TeamIdentifier=$APPLE_TEAM_ID" .build/Release/signature.txt
          grep -F 'Timestamp=' .build/Release/signature.txt
          grep -F '(runtime)' .build/Release/signature.txt
          lipo "$app/Contents/MacOS/Tastko" -verify_arch arm64
          mkdir -p .build/Release/assets
          staging="$(mktemp -d .build/Release/dmg.XXXXXX)"
          trap 'rm -rf "$staging"' EXIT
          ditto "$app" "$staging/Tastko.app"
          ln -s /Applications "$staging/Applications"
          dmg=".build/Release/assets/Tastko-${TAG_NAME}-macOS-arm64.dmg"
          hdiutil create -volname Tastko -srcfolder "$staging" \
            -fs APFS -format ULFO -ov "$dmg"
          codesign --sign 'Developer ID Application' --timestamp "$dmg"
          hdiutil verify "$dmg"

      - name: Notarize DMG
        run: |
          dmg=".build/Release/assets/Tastko-${TAG_NAME}-macOS-arm64.dmg"
          bash .github/scripts/notarize.sh "$dmg"
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          codesign --verify --strict --verbose=2 "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"

      - name: Generate update feed
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: |
          printf '%s' "$SPARKLE_PRIVATE_ED_KEY" | \
            .build/ReleaseDerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/generate_appcast \
              --ed-key-file - \
              --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG_NAME}/" \
              --link "https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG_NAME}" \
              --maximum-deltas 0 \
              .build/Release/assets
          test -s .build/Release/assets/appcast.xml

      - name: Package debug symbols
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            .build/Release/Tastko.xcarchive/dSYMs \
            ".build/Release/assets/Tastko-${TAG_NAME}-dSYMs.zip"

      - name: Generate checksum
        working-directory: .build/Release/assets
        run: |
          shasum -a 256 "Tastko-${TAG_NAME}-macOS-arm64.dmg" \
            "Tastko-${TAG_NAME}-dSYMs.zip" appcast.xml > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          flags=()
          if [[ "$TAG_NAME" == *-* ]]; then
            flags+=(--prerelease --latest=false)
          fi
          gh release create "$TAG_NAME" \
            ".build/Release/assets/Tastko-${TAG_NAME}-macOS-arm64.dmg" \
            ".build/Release/assets/Tastko-${TAG_NAME}-dSYMs.zip" \
            .build/Release/assets/appcast.xml \
            .build/Release/assets/SHA256SUMS.txt \
            --verify-tag \
            --title "Tastko ${TAG_NAME}" \
            --generate-notes \
            --notes "Requires an Apple Silicon Mac running macOS 27 or later. Open the DMG and drag Tastko into Applications. This build is signed with Developer ID and notarized by Apple." \
            "${flags[@]}"

      - name: Remove Apple signing credentials
        if: always()
        env:
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: bash .github/scripts/remove-signing.sh
